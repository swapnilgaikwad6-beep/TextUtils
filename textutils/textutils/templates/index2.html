<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
  </head>
  <body>


<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">

  <div class="container-fluid">
    <a class="navbar-brand" href="#">Text Utils</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">About Us</a>
        </li>
          <li class="nav-item">
          <a class="nav-link" href="#">Contact Us</a>
        </li>


      </ul>
      <form class="d-flex" role="search" >
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>




    <div class="alert alert-success alert-dismissible fade show mt-1 " role="alert">
  <strong>Welcome</strong> You should check our website.
  <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

    <div class="container">
<form action='/analyse' method='post'> {% csrf_token %}
    <!-- CSRF Security Token: Protects this form against Cross-Site Request Forgery attacks. -->

<div class="mb-3">
    <label for="myText" class="form-label">
        Enter Your Text Here and let Textutils do the magic
    </label>

    <textarea
        class="form-control"
        id="myText"
        name="text"
        rows="9"
        placeholder="Enter your text here...">
    </textarea>


    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="removepunc" role="switch" id="switchCheckChecked1">
  <label class="form-check-label" for="switchCheckChecked1">Remove Punctuations</label>
</div>

    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="fullcaps" role="switch" id="switchCheckChecked2">
  <label class="form-check-label" for="switchCheckChecked2">Upper Case</label>
</div>

    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="newlineremover" role="switch" id="switchCheckChecked3">
  <label class="form-check-label" for="switchCheckChecked3"> New Line Remover</label>
</div>

    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="spaceremover" role="switch" id="switchCheckChecked4">
  <label class="form-check-label" for="switchCheckChecked4">Space Remover</label>
</div>

    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="charcounter" role="switch" id="switchCheckChecked5">
  <label class="form-check-label" for="switchCheckChecked5"> Count the charecters </label>
</div>

    <div class="form-check form-switch my-2">
  <input class="form-check-input" type="checkbox" name="wordcounter" role="switch" id="switchCheckChecked6">
  <label class="form-check-label" for="switchCheckChecked6">Count the Words</label>
</div>

       <button type="submit" class="btn btn-dark mt-2">Analyse Text</button>
    </form>
</div>


    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
  </body>
</html>
